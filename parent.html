<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Angle Quest for parents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="aquarium.css">
<style>
/* Parent page: the same graph-paper look as the student pages. */
:root {
  --paper: #eef3f7; --grid: #dde7ef; --card: #ffffff; --ink: #1b2a3a; --ink-soft: #4d6073; --line: #c9d6e2;
  --accent: #f2b31b; --accent-ink: #4a3500; --accent-wash: rgba(242, 179, 27, .22);
  --blue: #2563c9; --blue-wash: #e3ecfb; --good: #1d8a4f; --good-wash: #e2f4ea; --bad: #c2412d; --bad-wash: #fbe7e3;
  --bar: #2a78d6; --bar-2: #1d8a4f; --track: #e6edf3;
  --f-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #111a24; --grid: #18232f; --card: #1a2633; --ink: #e8eef4; --ink-soft: #9fb0c1; --line: #2f3f50;
  --accent: #f5c04a; --accent-ink: #2a1e00; --accent-wash: rgba(245, 192, 74, .2);
  --blue: #7fa9f0; --blue-wash: #1f3150; --good: #5fd08f; --good-wash: #173826; --bad: #ff8a73; --bad-wash: #3e1f1a;
  --bar: #5b9cf0; --bar-2: #4cc283; --track: #243444; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #111a24; --grid: #18232f; --card: #1a2633; --ink: #e8eef4; --ink-soft: #9fb0c1; --line: #2f3f50;
  --accent: #f5c04a; --accent-ink: #2a1e00; --accent-wash: rgba(245, 192, 74, .2);
  --blue: #7fa9f0; --blue-wash: #1f3150; --good: #5fd08f; --good-wash: #173826; --bad: #ff8a73; --bad-wash: #3e1f1a;
  --bar: #5b9cf0; --bar-2: #4cc283; --track: #243444; color-scheme: dark; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; color: var(--ink); font: 17px/1.55 var(--f-body); }
button, input { font: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); font-weight: 800; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
.site-nav { max-width: 1120px; margin: 0 auto; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.site-nav a { text-decoration: none; color: var(--ink); font-weight: 700; padding: 6px 16px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); }
.site-nav a[aria-current="page"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.site-nav a:hover { border-color: var(--blue); }
.who { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: .88rem; color: var(--ink-soft); min-width: 0; }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34vw; }
#app { max-width: 1120px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 56px max(16px, env(safe-area-inset-left, 0px)); }
.eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 4px; }
.lede { color: var(--ink-soft); max-width: 62ch; margin: 8px 0 0; }
.btn { border: 2px solid var(--ink); background: var(--card); color: var(--ink); border-radius: 12px; padding: 10px 18px; font-weight: 700; }
.btn.primary { background: var(--ink); color: var(--card); }
.btn.small { padding: 5px 12px; border-radius: 9px; font-size: .9rem; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.ghost { border-color: var(--line); }
.btn:disabled { opacity: .5; cursor: default; }
.link-btn { background: none; border: 0; padding: 4px 0; color: var(--blue); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; }
.stack > * + * { margin-top: 18px; }
.msg { font-weight: 700; color: var(--ink-soft); margin: 10px 0 0; }
.msg.bad { color: var(--bad); }
.loading { color: var(--ink-soft); padding: 40px 0; text-align: center; }

/* signed out */
.hero { display: grid; gap: 20px; grid-template-columns: 1.2fr 1fr; align-items: center; margin-top: 10px; }
.hero ul { padding-left: 1.2em; margin: 14px 0 20px; }
.hero li { margin: 6px 0; }
.hero-art { font-size: clamp(4rem, 14vw, 7rem); text-align: center; line-height: 1.1; }
@media (max-width: 720px) { .hero { grid-template-columns: 1fr; } .hero-art { order: -1; font-size: 4rem; } }
.g-btn { display: inline-flex; align-items: center; gap: 10px; }
.g-btn svg { width: 20px; height: 20px; background: #fff; border-radius: 50%; padding: 2px; }

/* children */
.kids { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; margin-top: 16px; }
.kid { text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 16px 18px; color: var(--ink); display: grid; gap: 6px; }
.kid:hover { border-color: var(--blue); }
.kid-top { display: flex; align-items: center; gap: 12px; }
.avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font: 800 1.3rem var(--f-display); color: #fff; background: var(--kc, #2a78d6); flex: none; }
.kid-name { font: 800 1.35rem/1.1 var(--f-display); }
.kid-when { color: var(--ink-soft); font-size: .88rem; }
.kid-week { display: flex; gap: 16px; font-size: .9rem; color: var(--ink-soft); }
.kid-week b { color: var(--ink); font: 800 1.15rem var(--f-display); font-variant-numeric: tabular-nums; }
.add-kid { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; align-items: center; }
.add-kid input, .rename input { border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--card); color: var(--ink); min-width: 0; flex: 0 1 260px; }
.add-kid input:focus, .rename input:focus { border-color: var(--blue); outline: none; }
.dot-on { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--good); margin-right: 5px; vertical-align: 1px; }

/* child detail */
.d-head { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.d-head .kid-top { gap: 14px; }
.d-head .avatar { width: 58px; height: 58px; font-size: 1.6rem; }
.d-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; }
.tile-n { font: 800 1.9rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.tile-l { color: var(--ink-soft); font-size: .88rem; }
.pair { border: 2px dashed var(--blue); background: var(--blue-wash); }
.pair-code { font: 800 clamp(2.2rem, 9vw, 3.2rem)/1 var(--f-display); letter-spacing: .14em; margin: 8px 0; font-variant-numeric: tabular-nums; }
.pair ol { margin: 8px 0 0; padding-left: 1.2em; }
.rename { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.sec-h p { margin: 0; color: var(--ink-soft); font-size: .9rem; }

/* activity charts */
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 760px) { .charts { grid-template-columns: 1fr; } }
.chart { position: relative; }
.chart h3 { font-size: 1rem; margin-bottom: 2px; }
.chart .sum { color: var(--ink-soft); font-size: .88rem; margin: 0 0 6px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .axis { font: 11px var(--f-body); fill: var(--ink-soft); }
.chart .gridl { stroke: var(--line); stroke-width: 1; }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:hover + .bar, .chart .hit:focus + .bar { opacity: .75; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--card); border-radius: 8px; padding: 4px 9px; font-size: .82rem; white-space: nowrap; transform: translate(-50%, -100%); margin-top: -6px; z-index: 2; }
.tip[hidden] { display: none; }

/* weak spots */
.weak { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.weak li { border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 12px; padding: 10px 14px; background: var(--card); }
.weak .w-t { font-weight: 700; }
.weak .w-s { color: var(--ink-soft); font-size: .88rem; }
.weak .w-q { margin: 6px 0 0; padding-left: 1.1em; font-size: .9rem; }
.weak .w-q li { border: 0; padding: 0; margin: 2px 0; background: none; border-radius: 0; }
.tag { display: inline-block; font-size: .75rem; font-weight: 700; border-radius: 99px; padding: 1px 8px; margin-left: 6px; background: var(--accent-wash); color: var(--ink); vertical-align: 1px; }
.empty-note { color: var(--ink-soft); margin: 0; }

/* chapter progress */
.chap { border-top: 1px solid var(--line); }
.chap:first-of-type { border-top: 0; }
.chap > summary { list-style: none; display: grid; grid-template-columns: minmax(0, 1fr) minmax(90px, 32%) auto; gap: 12px; align-items: center; padding: 10px 2px; cursor: pointer; }
.chap > summary::-webkit-details-marker { display: none; }
.chap-t { font-weight: 700; min-width: 0; }
.chap-t small { display: block; font-weight: 400; color: var(--ink-soft); font-size: .82rem; }
.chap.cold .chap-t { color: var(--ink-soft); font-weight: 400; }
.meter { display: block; height: 10px; border-radius: 9px; background: var(--track); overflow: hidden; }
.meter > span { display: block; height: 100%; border-radius: 9px; background: var(--bar); }
.meter.sci > span { background: var(--bar-2); }
.chap-n { font-variant-numeric: tabular-nums; font-size: .88rem; color: var(--ink-soft); min-width: 4.5em; text-align: right; }
.chap-ex { padding: 0 0 10px 14px; display: grid; gap: 6px; }
.chap-ex .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(80px, 30%) auto; gap: 12px; align-items: center; font-size: .9rem; }
.subj-h { margin: 18px 0 2px; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); font-family: var(--f-body); }
@media (max-width: 520px) {
  .chap > summary, .chap-ex .row { grid-template-columns: minmax(0, 1fr) auto; }
  .chap > summary .meter, .chap-ex .row .meter { grid-column: 1 / -1; grid-row: 2; }
  .panel { padding: 14px; }
}
.sea-view .sea-sub { max-width: 60ch; }
</style>
</head>

</body>
