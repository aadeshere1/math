<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Angle Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: graph-paper desk; question card in the middle, exercise list beside it (stacks on phones). */
:root {
  --paper: #eef3f7;
  --grid: #dde7ef;
  --card: #ffffff;
  --ink: #1b2a3a;
  --ink-soft: #4d6073;
  --line: #c9d6e2;
  --accent: #f2b31b;       /* protractor yellow */
  --accent-ink: #4a3500;
  --accent-wash: rgba(242, 179, 27, .22);
  --blue: #2563c9;         /* geometry-set blue for figures and actions */
  --blue-wash: #e3ecfb;
  --good: #1d8a4f; --good-wash: #e2f4ea;
  --bad: #c2412d;  --bad-wash: #fbe7e3;
  --f-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #111a24; --grid: #18232f; --card: #1a2633; --ink: #e8eef4; --ink-soft: #9fb0c1; --line: #2f3f50;
  --accent: #f5c04a; --accent-ink: #2a1e00; --accent-wash: rgba(245, 192, 74, .2);
  --blue: #7fa9f0; --blue-wash: #1f3150; --good: #5fd08f; --good-wash: #173826; --bad: #ff8a73; --bad-wash: #3e1f1a;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #111a24; --grid: #18232f; --card: #1a2633; --ink: #e8eef4; --ink-soft: #9fb0c1; --line: #2f3f50;
  --accent: #f5c04a; --accent-ink: #2a1e00; --accent-wash: rgba(245, 192, 74, .2);
  --blue: #7fa9f0; --blue-wash: #1f3150; --good: #5fd08f; --good-wash: #173826; --bad: #ff8a73; --bad-wash: #3e1f1a;
  color-scheme: dark; }

* { box-sizing: border-box; }
body {
  background: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink); font: 17px/1.55 var(--f-body);
}
#app { max-width: 1120px; margin: 0 auto; padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2 { font-family: var(--f-display); line-height: 1.1; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 5vw, 2.8rem); font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 1.35rem; font-weight: 700; }
p { margin: 0; }
.eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); }
.lede { color: var(--ink-soft); max-width: 60ch; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* top bar */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.link-btn { background: none; border: 0; padding: 4px 2px; color: var(--blue); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.scorebox { display: flex; align-items: baseline; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 16px; font-variant-numeric: tabular-nums; }
.score-num { font-family: var(--f-display); font-weight: 800; font-size: 1.25rem; }
.score-lbl { color: var(--ink-soft); font-size: .85rem; }
.score-sep { width: 1px; height: 16px; background: var(--line); margin: 0 6px; align-self: center; }
.lesson-title { display: grid; gap: 2px; margin-bottom: 20px; }
.src { color: var(--ink-soft); font-size: .9rem; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } .side { order: -1; } }

/* exercise nav */
.side { display: grid; gap: 16px; min-width: 0; }
.sec-nav { display: grid; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; }
@media (max-width: 860px) {
  .sec-nav { display: flex; overflow-x: auto; scrollbar-width: thin; }
  .sec-btn { flex: 0 0 auto; grid-template-columns: auto auto !important; }
  .sec-btn .sec-name { display: none; }
}
.sec-btn { display: grid; grid-template-columns: 2.4rem 1fr auto; gap: 8px; align-items: center; text-align: left; background: none; border: 0; border-radius: 10px; padding: 8px 10px; }
.sec-btn:hover { background: var(--blue-wash); }
.sec-btn.on { background: var(--accent-wash); }
.sec-no { font-family: var(--f-display); font-weight: 800; color: var(--blue); }
.sec-name { font-size: .95rem; min-width: 0; }
.sec-count { font-size: .8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.sec-btn.done .sec-count { color: var(--good); font-weight: 700; }
.sec-btn.done .sec-count::before { content: "✓ "; }

.refbox { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
.refbox summary { font-weight: 700; cursor: pointer; }
.ref-scroll { overflow-x: auto; margin-top: 8px; }
.ref { border-collapse: collapse; font-size: .82rem; width: 100%; }
.ref th, .ref td { text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.ref th { color: var(--ink-soft); font-weight: 700; }

/* stage */
.stage { display: grid; gap: 14px; min-width: 0; scroll-margin-top: 12px; }
.sec-head { display: grid; gap: 6px; }
.qdots { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.qdot { width: 2.1rem; height: 2.1rem; border-radius: 50%; border: 2px solid var(--line); background: var(--card); font-weight: 700; }
.qdot.done { border-color: var(--good); background: var(--good-wash); color: var(--good); }
.qdot.on { border-color: var(--ink); box-shadow: 0 0 0 3px var(--accent); }

.qcard { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: clamp(16px, 3vw, 28px); display: grid; gap: 18px; box-shadow: 0 1px 0 var(--line), 0 10px 30px -18px rgba(20, 40, 70, .35); min-width: 0; }
.prompt { font-size: 1.2rem; }
.figwrap { display: grid; justify-items: center; gap: 10px; padding: 8px; border-radius: 12px; background: repeating-linear-gradient(0deg, transparent 0 19px, var(--grid) 19px 20px), repeating-linear-gradient(90deg, transparent 0 19px, var(--grid) 19px 20px); }
.figwrap.small { background: none; padding: 0; justify-items: start; }
.fig { width: 100%; max-width: 340px; height: auto; max-height: 300px; overflow: visible; }
.fig.fig-prot { max-width: 480px; max-height: 420px; }
.figwrap.small .fig { max-width: 170px; }
.tool-btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 6px 16px; font-weight: 700; }

.fig .ray { stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; }
.fig .ray.dashed { stroke-dasharray: 6 5; stroke-width: 1.6; stroke: var(--ink-soft); }
.fig .vertex { fill: var(--ink); }
.fig .mark { fill: none; stroke: var(--blue); stroke-width: 2; }
.fig .mark.dashed { stroke-dasharray: 4 4; }
.fig .chev { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.fig .mark.hl { stroke: var(--accent); stroke-width: 2.6; }
.fig .arc-label.hl { fill: var(--ink); }
.fig.fig-geo { max-width: 400px; }
.fig-geo .ray, .fig-geo .mark, .fig-geo .chev { vector-effect: non-scaling-stroke; }
.fig .circ { fill: none; }
.fig .shade.tone-a { fill: var(--blue-wash); stroke: none; }
.fig .shade.tone-b { fill: var(--accent-wash); stroke: none; }
.fig .pt-label { fill: var(--ink); font: 700 13px var(--f-body); text-anchor: middle; dominant-baseline: central; }
.fig .arc-label { fill: var(--blue); font: 700 12px var(--f-body); text-anchor: middle; dominant-baseline: central; }
.fig .prot-body { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.5; }
.fig .prot-inner { fill: none; stroke: var(--accent); stroke-width: 1; }
.fig .prot-tick { stroke: var(--ink-soft); stroke-width: .6; }
.fig .prot-guide { stroke: var(--accent); stroke-width: .5; }
.fig .prot-base { stroke: var(--accent); stroke-width: 1.5; }
.fig .prot-centre { fill: var(--bad); }
.fig .prot-out { fill: var(--ink-soft); font: 600 6.5px var(--f-body); text-anchor: middle; dominant-baseline: central; }
.fig .prot-in { fill: var(--ink); font: 700 7px var(--f-body); text-anchor: middle; dominant-baseline: central; }
.fig-clock { max-width: 220px; }
.fig .clock-face { fill: var(--card); stroke: var(--ink); stroke-width: 3; }
.fig-venn { max-width: 360px; }
.fig .venn-c { stroke: var(--ink); stroke-width: 2; fill-opacity: .55; }
.fig .venn-c.tone-a { fill: var(--blue-wash); }
.fig .venn-c.tone-b { fill: var(--accent-wash); }
.fig .venn-u { fill: none; stroke: var(--ink-soft); stroke-width: 1.5; }
.fig .venn-name { fill: var(--ink); font: 700 16px var(--f-body); text-anchor: middle; dominant-baseline: central; }
.fig .venn-item { fill: var(--ink); font: 600 14px var(--f-body); text-anchor: middle; dominant-baseline: central; }
.fig-grid { max-width: 260px; }
.fig .grid-cell { fill: var(--card); stroke: var(--ink); stroke-width: 1.5; }
.fig .grid-cell.head { fill: var(--blue-wash); }
.fig .grid-cell.blank { fill: var(--accent-wash); }
.fig .grid-t { fill: var(--ink); font: 700 17px var(--f-body); text-anchor: middle; dominant-baseline: central; }
.fig .grid-q { fill: var(--blue); font: italic 700 16px var(--f-body); text-anchor: middle; dominant-baseline: central; }
.fig .clock-tick { stroke: var(--ink-soft); stroke-width: .8; }
.fig .clock-num { fill: var(--ink); font: 700 9px var(--f-body); text-anchor: middle; dominant-baseline: central; }
.fig .clock-hand { stroke: var(--accent); stroke-width: 3.2; stroke-linecap: round; }
.fig .clock-hand.ghost { stroke: var(--ink-soft); stroke-width: 1.4; stroke-dasharray: 3 3; }
.fig .clock-pin { fill: var(--ink); }
.fig .clock-sweep { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1; }
.fig .clock-cap { fill: var(--ink); font: 700 7px var(--f-body); text-anchor: middle; }

/* answer parts */
.parts { display: grid; gap: 12px; }
.parts.many { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.part { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.part-lbl { font-weight: 700; min-width: 4.5rem; }
.inp-wrap { display: inline-flex; align-items: center; gap: 4px; background: var(--paper); border: 2px solid var(--line); border-radius: 10px; padding: 2px 10px; transition: border-color .15s; }
.inp-wrap:focus-within { border-color: var(--blue); }
.inp { border: 0; background: transparent; color: var(--ink); font: 700 1.15rem var(--f-body); width: 7.5rem; padding: 6px 0; outline: none; text-transform: none; }
.inp-number { width: 4.5rem; text-align: right; font-variant-numeric: tabular-nums; }
.inp-angleName, .inp-text { text-transform: uppercase; }
.inp-expr { width: 11rem; }
.inp-set, .inp-numeral { width: min(13rem, 52vw); }
.inp-alg { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.alg-prev { color: var(--ink-soft); font-weight: 700; font-size: 1.05rem; }
.inp::placeholder { color: var(--ink-soft); opacity: .6; font-weight: 400; text-transform: none; }
.affix { color: var(--ink-soft); font-weight: 700; }
[data-state="ok"].inp-wrap { border-color: var(--good); background: var(--good-wash); }
[data-state="bad"].inp-wrap { border-color: var(--bad); background: var(--bad-wash); }
.choices { display: flex; flex-wrap: wrap; gap: 8px; border-radius: 12px; }
.choice { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-weight: 700; }
.choice:hover { border-color: var(--blue); }
.choice[aria-checked="true"] { background: var(--blue); border-color: var(--blue); color: var(--card); }
[data-state="ok"].choices .choice[aria-checked="true"] { background: var(--good); border-color: var(--good); }
[data-state="bad"].choices .choice[aria-checked="true"] { background: var(--bad); border-color: var(--bad); }
.parts.many .part-choice .choice { padding: 4px 10px; font-size: .85rem; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { border: 2px solid var(--ink); background: var(--card); border-radius: 12px; padding: 10px 18px; font-weight: 700; }
.btn.primary { background: var(--ink); color: var(--card); }
.btn.help { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.btn.next { border-color: var(--good); background: var(--good); color: var(--card); margin-left: auto; }
.btn.small { padding: 5px 12px; border-radius: 9px; font-size: .9rem; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.btn:not(:disabled):active { transform: translateY(1px); }

.feedback { min-height: 1.5em; font-weight: 600; }
.feedback:empty { display: none; }
.feedback.good, .feedback.bad { padding: 10px 14px; border-radius: 10px; }
.feedback.good { background: var(--good-wash); color: var(--good); }
.feedback.bad { background: var(--bad-wash); color: var(--bad); }

/* help steps */
.help-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.help-steps:empty { display: none; }
.step { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--accent-wash); animation: rise .25s ease-out; }
.step-no { width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-weight: 800; }
.step.last .step-no { background: var(--good); color: var(--card); }
.step-body { display: grid; gap: 8px; min-width: 0; }
.ask { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ask .inp-wrap { background: var(--card); }
.ask-fb { font-size: .95rem; font-weight: 600; }
.ask-fb:empty { display: none; }
.ask-fb.good { color: var(--good); } .ask-fb.bad { color: var(--bad); }
@keyframes rise { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .step { animation: none; } }

/* home + finish */
.home-head, .finish { display: grid; gap: 10px; margin-bottom: 24px; }
.lesson-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 14px; }
.subject { grid-column: 1 / -1; margin-top: 8px; }
.lesson-card { display: grid; gap: 6px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.lesson-card:hover { border-color: var(--blue); }
.lc-level { font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--blue); }
.lc-title { font-family: var(--f-display); font-size: 1.5rem; font-weight: 800; line-height: 1.1; }
.lc-topic { font-weight: 700; }
.ex-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.ex-tab { display: inline-flex; gap: 8px; align-items: baseline; border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-weight: 700; }
.ex-tab:hover { border-color: var(--blue); }
.ex-tab.on { background: var(--ink); border-color: var(--ink); color: var(--card); }
.ex-count { font-size: .8rem; opacity: .75; font-variant-numeric: tabular-nums; }
.lc-src, .lc-stats { font-size: .85rem; color: var(--ink-soft); }
.meter { height: 8px; border-radius: 99px; background: var(--paper); overflow: hidden; }
.meter-fill { display: block; height: 100%; background: var(--accent); }
.finish { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: clamp(20px, 4vw, 40px); }
.stars { font-size: 3rem; color: var(--accent); letter-spacing: .1em; line-height: 1; }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--bad-wash); padding: 10px 14px; border-radius: 10px; }
</style>
</head>
